<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="900" height="620" fill="#f8fafc" rx="16"/>

  <!-- Título -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Arquitectura del Sistema — Predicción de Tráfico Madrid</text>
  <text x="450" y="56" text-anchor="middle" font-size="11" fill="#94a3b8">TFG · Alejandro Serrano Catalina</text>

  <!-- ═══════════════ CAPA USUARIO ═══════════════ -->
  <rect x="370" y="72" width="160" height="48" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="91" text-anchor="middle" font-size="11" fill="#64748b" font-weight="600">👤 USUARIO</text>
  <text x="450" y="107" text-anchor="middle" font-size="10" fill="#94a3b8">Navegador web / Móvil</text>

  <!-- flecha Usuario → Frontend -->
  <line x1="450" y1="120" x2="450" y2="142" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════ CAPA FRONTEND ═══════════════ -->
  <rect x="60" y="148" width="780" height="104" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="168" font-size="10" fill="#93c5fd" font-weight="700" letter-spacing="1">FRONTEND</text>
  <text x="80" y="182" font-size="11" font-weight="700" fill="#1d4ed8">React + Vite · localhost:5173</text>

  <!-- 4 pantallas -->
  <rect x="80"  y="192" width="158" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="159" y="210" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">📅 Planificador</text>
  <text x="159" y="226" text-anchor="middle" font-size="9"  fill="#3b82f6">Eventos + Google Calendar</text>

  <rect x="254" y="192" width="158" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="333" y="210" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">🤖 Agente IA</text>
  <text x="333" y="226" text-anchor="middle" font-size="9"  fill="#3b82f6">Chat lenguaje natural</text>

  <rect x="428" y="192" width="158" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="507" y="210" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">🗺️ Ruta</text>
  <text x="507" y="226" text-anchor="middle" font-size="9"  fill="#3b82f6">Mapa Leaflet + sensores</text>

  <rect x="602" y="192" width="218" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="711" y="210" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">⚙️ Ajustes</text>
  <text x="711" y="226" text-anchor="middle" font-size="9"  fill="#3b82f6">Preferencias + localStorage</text>

  <!-- flecha Frontend → Backend -->
  <line x1="450" y1="252" x2="450" y2="276" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
  <text x="455" y="267" font-size="9" fill="#2563eb">HTTP REST / JSON</text>

  <!-- ═══════════════ CAPA BACKEND ═══════════════ -->
  <rect x="60" y="282" width="780" height="170" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="302" font-size="10" fill="#86efac" font-weight="700" letter-spacing="1">BACKEND</text>
  <text x="80" y="316" font-size="11" font-weight="700" fill="#15803d">FastAPI + Python · localhost:8000</text>

  <!-- Módulos backend -->
  <!-- POST /predict -->
  <rect x="80"  y="326" width="170" height="110" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="165" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">POST /predict</text>
  <text x="165" y="361" text-anchor="middle" font-size="9"  fill="#16a34a">Routing OSMnx / Sensores</text>
  <text x="165" y="375" text-anchor="middle" font-size="9"  fill="#16a34a">BPR ETA Calculator</text>
  <text x="165" y="389" text-anchor="middle" font-size="9"  fill="#16a34a">Geocoding Nominatim</text>
  <text x="165" y="403" text-anchor="middle" font-size="9"  fill="#16a34a">Feature Builder</text>
  <text x="165" y="417" text-anchor="middle" font-size="9"  fill="#16a34a">LSTM Inference</text>
  <text x="165" y="430" text-anchor="middle" font-size="9"  fill="#16a34a">Scaler X/Y · Perfiles hist.</text>

  <!-- POST /agent/chat -->
  <rect x="268" y="326" width="160" height="110" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="348" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">POST /agent/chat</text>
  <text x="348" y="361" text-anchor="middle" font-size="9"  fill="#16a34a">Extracción JSON (LLM)</text>
  <text x="348" y="375" text-anchor="middle" font-size="9"  fill="#16a34a">→ predict_eta()</text>
  <text x="348" y="389" text-anchor="middle" font-size="9"  fill="#16a34a">Generación respuesta</text>
  <text x="348" y="403" text-anchor="middle" font-size="9"  fill="#16a34a">Historial multi-turno</text>

  <!-- Modelo LSTM -->
  <rect x="446" y="326" width="170" height="110" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="531" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Modelo LSTM</text>
  <text x="531" y="361" text-anchor="middle" font-size="9"  fill="#16a34a">TensorFlow / Keras</text>
  <text x="531" y="375" text-anchor="middle" font-size="9"  fill="#16a34a">Entrada: (N, 4, 22)</text>
  <text x="531" y="389" text-anchor="middle" font-size="9"  fill="#16a34a">Salida: intensidad,</text>
  <text x="531" y="403" text-anchor="middle" font-size="9"  fill="#16a34a">ocupación, carga</text>
  <text x="531" y="417" text-anchor="middle" font-size="9"  fill="#16a34a">22 features · 4 timesteps</text>
  <text x="531" y="431" text-anchor="middle" font-size="9"  fill="#16a34a">lstm_last.keras</text>

  <!-- Grafo OSM -->
  <rect x="634" y="326" width="186" height="110" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="727" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Grafo de Routing</text>
  <text x="727" y="361" text-anchor="middle" font-size="9"  fill="#16a34a">NetworkX Dijkstra</text>
  <text x="727" y="375" text-anchor="middle" font-size="9"  fill="#16a34a">Modo OSM (red vial real)</text>
  <text x="727" y="389" text-anchor="middle" font-size="9"  fill="#16a34a">Modo Sensores (grafo DGT)</text>
  <text x="727" y="403" text-anchor="middle" font-size="9"  fill="#16a34a">grafo_sensores_osm.graphml</text>

  <!-- ═══════════════ SERVICIOS EXTERNOS ═══════════════ -->
  <!-- flechas Backend → externos -->
  <line x1="165" y1="452" x2="165" y2="482" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="348" y1="452" x2="348" y2="482" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="531" y1="452" x2="531" y2="482" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="727" y1="452" x2="727" y2="482" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Open-Meteo -->
  <rect x="80"  y="488" width="170" height="56" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="165" y="508" text-anchor="middle" font-size="10" font-weight="700" fill="#c2410c">🌤️ Open-Meteo API</text>
  <text x="165" y="524" text-anchor="middle" font-size="9"  fill="#ea580c">Clima en tiempo real</text>
  <text x="165" y="536" text-anchor="middle" font-size="9"  fill="#ea580c">Sin API key · Gratuita</text>

  <!-- Ollama -->
  <rect x="268" y="488" width="160" height="56" rx="8" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="348" y="508" text-anchor="middle" font-size="10" font-weight="700" fill="#7e22ce">🦙 Ollama (Local)</text>
  <text x="348" y="524" text-anchor="middle" font-size="9"  fill="#9333ea">LLM llama3 · Sin coste</text>
  <text x="348" y="536" text-anchor="middle" font-size="9"  fill="#9333ea">localhost:11434</text>

  <!-- Datos DGT -->
  <rect x="446" y="488" width="170" height="56" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="531" y="508" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">📡 Datos DGT</text>
  <text x="531" y="524" text-anchor="middle" font-size="9"  fill="#b45309">Sensores M30 Madrid</text>
  <text x="531" y="536" text-anchor="middle" font-size="9"  fill="#b45309">Entrenamiento LSTM</text>

  <!-- OSM -->
  <rect x="634" y="488" width="186" height="56" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="727" y="508" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">🗺️ OpenStreetMap</text>
  <text x="727" y="524" text-anchor="middle" font-size="9"  fill="#dc2626">Red vial Madrid</text>
  <text x="727" y="536" text-anchor="middle" font-size="9"  fill="#dc2626">Geocoding Nominatim</text>

  <!-- Leyenda tecnologías -->
  <rect x="60" y="560" width="780" height="46" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="577" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1">STACK TECNOLÓGICO</text>
  <text x="80" y="595" font-size="9" fill="#64748b">Frontend: React 18 · Vite · Tailwind · Leaflet · React-Router</text>
  <text x="430" y="595" font-size="9" fill="#64748b">Backend: FastAPI · Pandas · NetworkX · OSMnx · TensorFlow · Ollama</text>
</svg>
